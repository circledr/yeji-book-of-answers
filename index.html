<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YEJI's Book of Answers</title>

  <!--
    字体说明：
    - Irish Grover   → "YEJI's" 大标题
    - Kranky         → "Book of Answers" 副标题 + footer
    - Roboto         → 导航按钮等 UI 功能性文字（英文）
    - Noto Serif SC  → 副标题、输入框（中文衬线）
    - Noto Sans SC   → 产品 UI 中文（v1.0 备用；语言切换时用）
    - Noto Sans KR   → 产品 UI 韩文（v1.4 备用）
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Kranky&family=Roboto:wght@400;500&family=Noto+Serif+SC:wght@400;500&family=Noto+Serif+KR:wght@400&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- ── 顶部导航 ── -->
    <nav id="top-nav" class="top-nav">
      <button class="nav-btn lang-btn">
        <img src="images/illustrations/globe.svg" alt="" class="nav-icon-img">
        <span>CN</span>
        <span class="nav-caret">▾</span>
      </button>
      <button class="nav-btn about-btn">
        <img src="images/illustrations/Circle-Info.svg" alt="" class="nav-icon-img">
        <span>About</span>
      </button>
    </nav>

    <!-- ── 主体内容 ── -->
    <main id="landing-content" class="main-content">

      <!-- 主标题 -->
      <header class="title-block">
        <div class="title-yeji">YEJI's</div>
        <div class="title-boa">Book of Answers</div>
      </header>

      <!-- 副标题 -->
      <p class="subtitle">
        此时此刻，你的困惑是什么呢？<br>
        或许礼志的答案之书提前准备了回答
      </p>

      <!-- 输入框 -->
      <div class="input-wrapper">
        <input
          id="question-input"
          type="text"
          class="question-input"
          placeholder="/ 写下你的问题，或深呼吸，在心中默念"
        >
      </div>

      <!-- 信封插画（SVG导出 + 叠加心形） -->
      <div class="envelope-wrapper">
        <img src="images/illustrations/envelope.svg" alt="信封" class="envelope-img">
        <!-- SVG里只有圆圈无心形，用CSS叠加在圆圈中心 -->
        <span class="envelope-heart">♥</span>
      </div>

      <!-- 打开按钮 -->
      <button id="open-btn" class="open-btn">打开</button>

    </main>

    <!-- ── 结果视图（初始隐藏） ── -->
    <div id="result-view" class="result-view hidden">

      <!-- result-inner：所有内容作为一个整体垂直居中 -->
      <div class="result-inner">

        <!-- 关闭按钮行 -->
        <div class="result-header">
          <button id="close-btn" class="close-btn">×</button>
        </div>

        <!-- 内容卡片 -->
        <div class="result-card">
          <!-- 用户问题：有输入时显示，无输入时隐藏 -->
          <div id="user-question" class="user-question hidden">
            <p id="question-text" class="question-text"></p>
            <div class="card-divider"></div>
          </div>
          <!-- 编号 -->
          <p id="bubble-number" class="bubble-number">No.01</p>
          <!-- Bubble 截图 -->
          <img id="bubble-img" class="bubble-img" src="" alt="YEJI的话">
        </div>

        <!-- 长按提示 -->
        <p class="save-hint">[长按卡片，保存为图片]</p>

        <!-- YEJI 语录 -->
        <div class="yeji-quote">
          <p class="yeji-quote-kr">남은 하루도 좋은 하루 보내기야🍀</p>
          <p class="yeji-quote-cn">（剩下的一天也要美好地度过🍀）</p>
        </div>

        <!-- 操作按钮 -->
        <div class="result-buttons">
          <button id="again-btn" class="result-btn">再翻一次</button>
          <button id="ok-btn" class="result-btn">好~</button>
        </div>

      </div><!-- /result-inner -->
    </div>

    <!-- ── 底部 ── -->
    <footer class="footer">
      <div class="footer-divider"></div>
      <p>Developed by <a href="https://x.com/cir_Dr321" class="footer-link" target="_blank" rel="noopener">Circle</a> with 🖤</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
