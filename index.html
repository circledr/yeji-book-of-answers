<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YEJI's Book of Answers</title>

  <!--
    字体说明：
    - Irish Grover   → "YEJI's" 大标题
    - Kranky         → "Book of Answers" 副标题 + footer
    - Roboto         → 导航按钮等 UI 功能性文字（英文）
    - Noto Serif SC  → 副标题、输入框（中文衬线）
    - Noto Sans SC   → 产品 UI 中文（v1.0 备用；语言切换时用）
    - Noto Sans KR   → 产品 UI 韩文（v1.4 备用）
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Kranky&family=Roboto:wght@400;500&family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- ── 顶部导航 ── -->
    <nav class="top-nav">
      <button class="nav-btn lang-btn">
        <img src="images/illustrations/globe.svg" alt="" class="nav-icon-img">
        <span>CN</span>
        <span class="nav-caret">▾</span>
      </button>
      <button class="nav-btn about-btn">
        <img src="images/illustrations/Circle-Info.svg" alt="" class="nav-icon-img">
        <span>About</span>
      </button>
    </nav>

    <!-- ── 主体内容 ── -->
    <main class="main-content">

      <!-- 主标题 -->
      <header class="title-block">
        <div class="title-yeji">YEJI's</div>
        <div class="title-boa">Book of Answers</div>
      </header>

      <!-- 副标题 -->
      <p class="subtitle">
        此时此刻，你的困惑是什么呢？<br>
        或许礼志的答案之书提前准备了回答
      </p>

      <!-- 输入框 -->
      <div class="input-wrapper">
        <input
          type="text"
          class="question-input"
          placeholder="/ 写下你的问题，或深呼吸，在心中默念"
        >
      </div>

      <!-- 信封插画（SVG导出 + 叠加心形） -->
      <div class="envelope-wrapper">
        <img src="images/illustrations/envelope.svg" alt="信封" class="envelope-img">
        <!-- SVG里只有圆圈无心形，用CSS叠加在圆圈中心 -->
        <span class="envelope-heart">♥</span>
      </div>

      <!-- 打开按钮 -->
      <button class="open-btn">打开</button>

    </main>

    <!-- ── 底部 ── -->
    <footer class="footer">
      <p>Developed by Circle with 🖤</p>
    </footer>

  </div>

</body>
</html>
